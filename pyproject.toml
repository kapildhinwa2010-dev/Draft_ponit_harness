[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "drift-point"
version = "0.1.0"
description = "Measure WHERE a compressed replay first diverges from the original model: token-level drift-point for rank-k delta replays."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kapil Dhinwa" }]
keywords = ["compression", "interpretability", "language-models", "evaluation"]
dependencies = [
  "torch",
  "transformers",
  "numpy",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
